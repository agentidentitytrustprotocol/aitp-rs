[workspace]
resolver = "2"
# Exclude `fuzz/` — cargo-fuzz uses its own profile and nightly-only
# features. Run via `cargo +nightly fuzz run <target>` from the
# `fuzz/` directory.
#
# `bindings/*` are excluded: the PyO3 / NAPI-rs crates are `cdylib`s
# built by maturin / napi-cli against an external Python / Node
# toolchain, so they must not be pulled into `cargo test --workspace`.
#
# `tests/e2e-llm` is excluded: it talks to live LLM provider APIs
# (OpenAI / Anthropic) gated on `AITP_RUN_LLM_TESTS=1`, and must not
# run under `cargo test --workspace` so CI never burns API credits.
# Run it explicitly from `tests/e2e-llm/`.
exclude = ["fuzz", "bindings/aitp-py", "bindings/aitp-node", "tests/e2e-llm"]
members = [
    "crates/aitp-core",
    "crates/aitp-crypto",
    "crates/aitp-envelope",
    "crates/aitp-manifest",
    "crates/aitp-handshake",
    "crates/aitp-tct",
    "crates/aitp-delegation",
    "crates/aitp-session-bundle",
    "crates/aitp-transport-http",
    "crates/aitp",
    "crates/aitp-cli",
    "crates/aitp-conformance",
    "crates/aitp-rs-adapter",
    "examples/two-agents",
    "tools/mint-signed-examples",
    "tools/mint-conformance-fixtures",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentidentitytrustprotocol/aitp-rs"
homepage = "https://github.com/agentidentitytrustprotocol/aitp-rs"
authors = ["AITP contributors"]
keywords = ["aitp", "agent", "trust", "identity", "ed25519"]
categories = ["cryptography", "authentication"]

[workspace.dependencies]
# Pinned core deps. Every crate references these via { workspace = true }
# so the workspace has exactly one version of each.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_jcs = "0.2"
thiserror = "2.0"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
# P-256 ECDSA — RFC-AITP-0001 §5.4.3 / §5.5.2 wire format for the
# `p256` algorithm tag. `ecdsa` enables both verifying and signing
# (the latter is used by `AitpSigningKey::P256` once an agent picks
# the P-256 suite). `arithmetic` is required to derive the public
# point from a freshly-generated scalar.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std", "arithmetic"] }
base64ct = { version = "1.6", features = ["std"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
sha2 = "0.11"
url = { version = "2.5", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
rand = "0.10"

# HTTP transport (feature-gated, only used by aitp-transport-http)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", default-features = false }

# TLS — used by aitp-transport-http for SPKI cert pinning. The `ring`
# feature gives access to `rustls::crypto::ring::default_provider()` as a
# fallback when no CryptoProvider has been installed yet (e.g. callers
# building a pinned client config before any reqwest call has had a
# chance to install one). reqwest's rustls-tls feature installs a
# provider on first use; the fallback only fires before that.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1.10"
# X.509 parser for extracting SubjectPublicKeyInfo bytes when pinning.
x509-parser = "0.18"

# RS256 (RSA) JWS signature verification for OIDC ID tokens and DPoP
# proofs (`aitp_handshake::verify_jws_signature`), replacing the RS256
# support `jsonwebtoken` used to provide (issue #99). `ring`'s
# `RsaPublicKeyComponents::verify` with `RSA_PKCS1_2048_8192_SHA256` is
# the same verification code path `jsonwebtoken` 9's RS256 backend used
# internally, so this is not a new crypto implementation — it's already
# in the tree transitively via `rustls`/`jsonwebtoken` 9, and this pin
# just makes that dependency direct and explicit. Pinned to the version
# already resolved in Cargo.lock so declaring it directly does not
# introduce a duplicate.
ring = "0.17"

# OIDC / DPoP JOSE helper — issue #99 resolution: `jsonwebtoken` is now a
# **dev-only** dependency, used solely as a differential test oracle
# (see `crates/aitp-transport-http/tests/jose_backend_tripwire.rs` and
# `crates/aitp-crypto`'s JWS KATs). No runtime crate in this workspace
# depends on it any more.
#
# Background on why it was dropped from the runtime graph, not just
# re-pinned: jsonwebtoken 9 carries its own `ring`-backed crypto,
# disjoint from the RustCrypto stack this workspace pins for its own
# signatures. jsonwebtoken 10+ dropped that bundled backend and
# requires opting into exactly one of two features (without one, every
# sign/verify call panics at runtime with "Could not automatically
# determine the process-level CryptoProvider" — see
# `jose_backend_tripwire.rs`). As of 11.0.0 both are worse than staying
# on 9.x:
#
#   * `rust_crypto` pins ed25519-dalek 2.1, p256 0.13, sha2 0.10 and
#     rand 0.8 — i.e. the pre-bump stack. Enabling it alongside this
#     workspace's ed25519-dalek 3 / p256 0.14 / sha2 0.11 forks the
#     dependency tree, shipping *two* Ed25519 and *two* P-256
#     implementations. It also drags in `rsa` 0.9, which carries
#     RUSTSEC-2023-0071 (Marvin timing sidechannel) with no patched
#     release.
#   * `aws_lc_rs` clears both, but adds a C/CMake/NASM build dependency
#     to the maturin and napi-rs wheel matrices.
#
# This is a closed, passively-maintained upstream line with no version
# that both tracks current RustCrypto and avoids `rsa` 0.9 — so instead
# of waiting on it, RS256 (RSA) JWS verification now goes through
# `ring` directly (see the `ring` entry below and
# `aitp_handshake::verify_jws_signature`), and EdDSA/ES256 go through
# this workspace's own `aitp-crypto` JWS stack. Verification-only usage
# is unaffected by RUSTSEC-2023-0071, which is a signing/decryption
# padding-timing issue, not a verification one.
#
# Tracked upstream of this decision by the cargo-deny
# `deny-multiple-versions` guard in deny.toml, which turns any
# reintroduction of a forked crypto stack into a red build.
#
# `aitp_handshake::JwkPublicKey`'s public fields are now owned types
# with no JOSE-library dependency (see `crates/aitp-handshake/src/jwk.rs`),
# so this dependency's version is no longer semver-visible to
# aitp-handshake or the bindings.
jsonwebtoken = "9.3"

# Non-poisoning Mutex for HTTP server state. parking_lot::Mutex never enters
# a poisoned state on a panic in a locked section — std::sync::Mutex would,
# and an unwrap on the resulting PoisonError hangs every subsequent request.
parking_lot = "0.12"

# Structured logging. Library crates emit spans + events; binaries (or
# downstream applications) install a subscriber. Default-features-off keeps
# the dep lean for library consumers that don't subscribe.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

# Metrics facade (optional, feature-gated in aitp-transport-http). Just the
# lightweight recording API — the binary installs the recorder/exporter.
# Zero-cost when no recorder is registered.
metrics = "0.24"

# CLI (used by aitp-conformance)
clap = { version = "4.5", features = ["derive"] }

# Test deps
proptest = "1.4"
hex = "0.4"
# JSON Schema validator — used in tests/schema.rs to catch wire-type drift
# from the AITP JSON Schemas. Test-only; do NOT take a runtime dependency.
boon = "0.6"
# Benchmark harness for the JCS/JWS/TCT hot paths (crates/*/benches/).
# `cargo_bench_support` pulls in `rayon`, which this workspace otherwise
# has no reason to depend on — harmless as a dev-only dependency.
criterion = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
