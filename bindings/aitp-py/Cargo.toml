# Standalone package: NOT a member of the aitp-rs workspace (it is in
# the workspace `exclude` list). Built by maturin against an external
# CPython, so it carries its own `[workspace]` table and `Cargo.lock`.
[package]
name = "aitp-py"
version = "0.25.1"
edition = "2021"
description = "Agent Identity Trust Protocol — Python SDK"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
name = "aitp"
crate-type = ["cdylib"]

# `extension-module` is opt-in so `cargo check` / `cargo build` work
# standalone. maturin enables it via pyproject.toml `[tool.maturin]`.
# A plain `cargo build` (feature off) links libpython for local
# testing; the importable wheel must be built with the feature on.
#
# The default build, and so the published wheel, has the stable surface
# plus SPKI pinning. The `experimental-*` features (umbrella
# `experimental`) add renewal, session bundles, multi-hop delegation and
# the A2A Agent Card binding to a source build; they carry no stability
# promise.
[features]
extension-module = ["pyo3/extension-module"]
default = ["spki-pinning"]
# Experimental (no promise; not in the published packages): TCT renewal
# (RFC-AITP-0013, `aitp_experimental::renewal`).
experimental-renewal = ["dep:aitp-experimental"]
# Experimental: Session Trust Bundles (RFC-AITP-0010) — exposes
# `SessionBundleBuilder`.
experimental-session-bundle = ["dep:aitp-experimental"]
# SPKI cert pinning — exposes `compute_spki_hash()` and `SpkiPinVerifier`.
# Implemented standalone on top of x509-parser + sha2 (no rustls, no
# `aitp::transport`, no tokio/hyper) to keep the wheel small.
spki-pinning = ["dep:x509-parser"]
# Experimental: multi-hop delegation (RFC-AITP-0011,
# `aitp_experimental::delegation`).
# The strict single-hop `verify_delegation` is always present; this
# additionally exposes `verify_delegation_multihop`.
experimental-multihop-delegation = ["dep:aitp-experimental"]
# Experimental: A2A Agent Card binding, client verification (RFC-AITP-0014,
# `aitp_experimental::a2a`).
experimental-a2a-agent-card = ["dep:aitp-experimental", "aitp-experimental/a2a-agent-card"]
# Every experimental feature.
experimental = [
    "experimental-renewal",
    "experimental-session-bundle",
    "experimental-multihop-delegation",
    "experimental-a2a-agent-card",
]

[dependencies]
aitp = { path = "../../crates/aitp", default-features = false }
aitp-experimental = { path = "../../crates/aitp-experimental", optional = true }
x509-parser = { version = "0.18", optional = true }
sha2 = "0.11"

# abi3-py310: build a single forward-compatible wheel (cp310-abi3) per
# platform that runs on CPython 3.10+ via the stable ABI, instead of one
# wheel per interpreter version. Keeps the release matrix to one build
# per OS/arch and matches `requires-python = ">=3.10"` in pyproject.toml.
pyo3 = { version = "0.30", features = ["abi3-py310"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
rand = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
