# Standalone package: NOT a member of the aitp-rs workspace (it is in
# the workspace `exclude` list). Built by `@napi-rs/cli` against an
# external Node.js, so it carries its own `[workspace]` table.
[package]
name = "aitp-node"
version = "0.24.1"
edition = "2021"
description = "Agent Identity Trust Protocol — Node.js SDK"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "2"

# The default build, and so the published `.node`, has the stable surface
# plus SPKI pinning. The `experimental-*` features (umbrella
# `experimental`) add renewal, session bundles and multi-hop delegation
# to a source build; they carry no stability promise.
[features]
default = ["spki-pinning"]
# Experimental (no promise; not in the published packages): TCT renewal
# (RFC-AITP-0013, `aitp_experimental::renewal`).
experimental-renewal = ["dep:aitp-experimental"]
# Experimental: Session Trust Bundles (RFC-AITP-0010) — exposes
# `SessionBundleBuilder`.
experimental-session-bundle = ["dep:aitp-experimental"]
# SPKI cert pinning — see aitp-py Cargo.toml for the rationale.
spki-pinning = ["dep:x509-parser"]
# Experimental: multi-hop delegation (RFC-AITP-0011,
# `aitp_experimental::delegation`).
# The strict single-hop `verifyDelegation` is always present; this
# additionally exposes `verifyDelegationMultihop`.
experimental-multihop-delegation = ["dep:aitp-experimental"]
# Every experimental feature.
experimental = [
    "experimental-renewal",
    "experimental-session-bundle",
    "experimental-multihop-delegation",
]

[dependencies]
aitp = { path = "../../crates/aitp", default-features = false }
aitp-experimental = { path = "../../crates/aitp-experimental", optional = true }
x509-parser = { version = "0.18", optional = true }
sha2 = "0.11"

napi = { version = "3", features = ["napi8"] }
napi-derive = "3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
rand = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
