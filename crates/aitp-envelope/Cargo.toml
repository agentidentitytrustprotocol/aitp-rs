[package]
name = "aitp-envelope"
description = "AITP envelope signing and verification (no I/O, no HTTP)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true

[dependencies]
aitp-core = { path = "../aitp-core", version = "=0.13.2" }
aitp-crypto = { path = "../aitp-crypto", version = "=0.13.2" }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# `aitp_crypto::testing::MockKmsSigner` for the KMS-backend tests.
aitp-crypto = { path = "../aitp-crypto", features = ["test-util"] }
proptest = { workspace = true }
tokio = { workspace = true }
