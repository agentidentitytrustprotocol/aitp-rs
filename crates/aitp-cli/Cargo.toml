[package]
name = "aitp-cli"
description = "Command-line tool for AITP: keys, TCT and Manifest verification, and live handshakes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
readme = "README.md"

[[bin]]
name = "aitp"
path = "src/main.rs"

[features]
default = ["http-client"]
# `aitp handshake` and `aitp manifest fetch`: reqwest over rustls with
# webpki-roots, via the facade's SSRF-guarded client. Build with
# `--no-default-features` for the offline commands only.
http-client = ["aitp/http-client", "dep:tokio", "dep:url", "dep:reqwest", "dep:uuid"]
# `aitp serve --interop`: the public interop peer (docs/interop-peer.md).
serve = [
    "http-client",
    "aitp/http-server",
    "aitp/experimental-axum",
    "aitp/pinned-admission",
    "dep:axum",
    "dep:tower",
    "dep:tracing",
    "dep:tracing-subscriber",
    "tokio/net",
    "tokio/signal",
    "tokio/time",
]

[dependencies]
# default-features off so `--no-default-features` drops the HTTP stack;
# the `http-client` feature above turns it back on.
aitp = { path = "../aitp", version = "=0.24.0", default-features = false }
tokio = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
# `aitp enroll` posts to the interop peer's own (non-AITP) endpoints.
reqwest = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true, features = ["util"] }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
clap = { workspace = true, features = ["env"] }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
# Integration tests run the binary against a real `HandshakeServer` on
# loopback.
aitp = { path = "../aitp", version = "=0.24.0", features = ["http-server"] }
assert_cmd = "2"
predicates = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
axum = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde_json = { workspace = true }
