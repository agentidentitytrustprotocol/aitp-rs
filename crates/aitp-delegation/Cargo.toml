[package]
name = "aitp-delegation"
description = "Single-hop delegation tokens for AITP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true

[dependencies]
tracing = { workspace = true }
aitp-core = { path = "../aitp-core", version = "=0.23.0" }
aitp-crypto = { path = "../aitp-crypto", version = "=0.23.0" }
aitp-manifest = { path = "../aitp-manifest", version = "=0.23.0" }
aitp-tct = { path = "../aitp-tct", version = "=0.23.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# `aitp_crypto::testing::MockKmsSigner` for the KMS-backend tests.
aitp-crypto = { path = "../aitp-crypto", features = ["test-util"] }
boon = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true }
