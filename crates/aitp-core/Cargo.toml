[package]
name = "aitp-core"
description = "Core types, JSON canonicalization, base64url, and AID handling for AITP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_jcs = { workspace = true }
thiserror = { workspace = true }
base64ct = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
metrics = { workspace = true, optional = true }

[features]
default = []
# The `aitp_admission_nonces_outstanding` gauge from `InMemoryNonceStore`
# via the `metrics` facade. `aitp-handshake/metrics` enables it.
metrics = ["dep:metrics"]

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "jcs_canonicalize"
harness = false
