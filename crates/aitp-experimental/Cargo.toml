[package]
name = "aitp-experimental"
description = "Agent Identity & Trust Protocol: experimental surface (multi-hop delegation, Session Trust Bundles, TCT renewal, SPIFFE identity, A2A Agent Card binding). No stability promise."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true

[features]
default = []
# `SessionBundleServer` (RFC-AITP-0010 §4.3.1) and `renewal::RenewalServer`
# (RFC-AITP-0013), the HTTP endpoints. Turns on `aitp/http-server`;
# nothing else here does, so depending on this crate never forces the
# server onto `aitp`.
http-server = ["aitp/http-server", "dep:axum", "dep:parking_lot", "dep:tokio"]
# `renewal::renew_tct`, the holder's renewal HTTP client.
http-client = ["aitp/http-client", "dep:reqwest", "dep:rand"]
# `spiffe`: SPIFFE identity verification (RFC-AITP-0002 §6).
spiffe-identity = ["dep:webpki", "dep:rustls-pki-types", "dep:x509-parser", "dep:base64ct"]
# `a2a`: the A2A Agent Card binding's client verification (RFC-AITP-0014).
# Pure: no I/O, no new dependency.
a2a-agent-card = []

[dependencies]
aitp = { path = "../aitp", version = "=0.25.1", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
axum = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }
reqwest = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
base64ct = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"], optional = true }
tracing = { workspace = true }

[dev-dependencies]
boon = { workspace = true }
aitp = { path = "../aitp", default-features = false, features = ["test-util", "experimental-axum"] }
hex = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
reqwest = { workspace = true }
ring = { workspace = true }
p521 = { workspace = true }
base64ct = { workspace = true }

[[test]]
name = "session_bundle_endpoint"
required-features = ["http-server"]

[[test]]
name = "renewal_server"
required-features = ["http-server"]

[[test]]
name = "renewal_client"
required-features = ["http-server", "http-client"]

[[test]]
name = "spiffe_x509_proof_kat"
required-features = ["spiffe-identity"]

[[test]]
name = "a2a_binding"
required-features = ["a2a-agent-card"]
