[package]
name = "aitp-conformance"
description = "Conformance test runner for AITP implementations"
# Test tooling, not published: the conformance runner (`aitp-conformance`)
# and the aitp-rs adapter it drives (`aitp-rs-adapter`), two binaries over
# one library. Matches release-plz.toml (release = false).
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true

[features]
default = []
# `in-process` brings the in-process adapter into scope. It calls
# `rs_adapter::handle` directly, the same dispatch the `aitp-rs-adapter`
# binary uses, so in-process and subprocess runs cannot drift.
in-process = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
# Minting the SPIFFE fixtures' test CA and X509-SVIDs, and the JWT-SVID
# authority's public JWK.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
time = "0.3"
p256 = { workspace = true }
base64ct = { workspace = true }

aitp = { path = "../aitp", version = "=0.23.0", default-features = false, features = ["pinned-admission", "experimental-spiffe-identity"] }
aitp-experimental = { path = "../aitp-experimental", version = "=0.23.0" }
url = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
# Validates `--report` output against the vendored spec schema.
jsonschema = { version = "0.58", default-features = false }
sha2 = { workspace = true }
hex = { workspace = true }
