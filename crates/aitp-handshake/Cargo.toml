[package]
name = "aitp-handshake"
description = "Mutual handshake state machine for AITP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true

[dependencies]
tracing = { workspace = true }
aitp-core = { path = "../aitp-core", version = "=0.9.0" }
aitp-crypto = { path = "../aitp-crypto", version = "=0.9.0" }
aitp-manifest = { path = "../aitp-manifest", version = "=0.9.0" }
aitp-tct = { path = "../aitp-tct", version = "=0.9.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
# RS256 (RSA) JWS verification for OIDC ID tokens — see the
# `verify_jws_signature` doc comment in `src/jwk.rs`. Already in the
# dependency tree transitively via `rustls`; declared directly here
# (rather than relying on the transitive pull) so this crate's use of
# it is explicit and pinned by the workspace.
ring = { workspace = true }

[dev-dependencies]
boon = { workspace = true }
ed25519-dalek = { workspace = true }
base64ct = { workspace = true }
