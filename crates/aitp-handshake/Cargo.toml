[package]
name = "aitp-handshake"
description = "Mutual handshake state machine for AITP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true

[dependencies]
tracing = { workspace = true }
aitp-core = { path = "../aitp-core", version = "=0.23.0" }
aitp-crypto = { path = "../aitp-crypto", version = "=0.23.0" }
aitp-manifest = { path = "../aitp-manifest", version = "=0.23.0" }
aitp-tct = { path = "../aitp-tct", version = "=0.23.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
# RS256 (RSA) JWS verification for OIDC ID tokens — see the
# `verify_jws_signature` doc comment in `src/jwk.rs`. Already in the
# dependency tree transitively via `rustls`; declared directly here
# (rather than relying on the transitive pull) so this crate's use of
# it is explicit and pinned by the workspace.
ring = { workspace = true }
metrics = { workspace = true, optional = true }
# SPIFFE identity (`experimental-spiffe-identity`): X509-SVID path
# validation (webpki, ring backend), leaf inspection (x509-parser) and
# standard-base64 `x5c` decoding.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"], optional = true }
rustls-pki-types = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }
base64ct = { workspace = true, optional = true }

[features]
default = []
# One-way pinned-key admission (RFC-AITP-0002 §3.4 profile, proposal
# agentidentitytrustprotocol#72 Items 5/7d): challenge nonces, a bounded
# single-use nonce store, per-source rate limiting. No extra dependencies.
# Off by default: it is an OPTIONAL profile of RFC-AITP-0002.
pinned-admission = []
# Admission counters and the outstanding-nonce gauge via the `metrics`
# facade (zero-cost with no recorder installed). Only emits anything
# with `pinned-admission` on. `aitp-transport-http/metrics` enables it.
metrics = ["dep:metrics", "aitp-core/metrics"]
# SPIFFE identity verification (RFC-AITP-0002 §6). Experimental:
# `spiffe` is at registry status Proposed and RFC-0002 OQ-7 is open, so
# its API and behaviour can change in any release.
experimental-spiffe-identity = [
    "dep:webpki",
    "dep:rustls-pki-types",
    "dep:x509-parser",
    "dep:base64ct",
]

[dev-dependencies]
# `aitp_crypto::testing::MockKmsSigner` for the KMS-backend tests.
aitp-crypto = { path = "../aitp-crypto", features = ["test-util"] }
boon = { workspace = true }
ed25519-dalek = { workspace = true }
p256 = { workspace = true }
base64ct = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }

[package.metadata.docs.rs]
features = ["pinned-admission", "experimental-spiffe-identity"]
