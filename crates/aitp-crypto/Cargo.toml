[package]
name = "aitp-crypto"
description = "Ed25519/P-256 signing, JWK thumbprint, and compact-JWS primitives for AITP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true

[dependencies]
aitp-core = { path = "../aitp-core", version = "=0.18.0" }
ed25519-dalek = { workspace = true }
p256 = { workspace = true }
ecdsa = { workspace = true }
sha2 = { workspace = true }
base64ct = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
# Exposes `aitp_crypto::testing::MockKmsSigner`, a deterministic stand-in
# for a cloud KMS backend (DER output, high-S, randomized nonces, key
# mismatch, transient failures). For tests in this and downstream crates.
test-util = []

[dev-dependencies]
# Self dev-dependency: integration tests get `aitp_crypto::testing`.
aitp-crypto = { path = ".", features = ["test-util"] }
aitp-core = { path = "../aitp-core" }
tokio = { workspace = true }
hex = { workspace = true }
# Differential oracle for the compact-JWS profile: every token we mint
# must verify with an off-the-shelf JOSE library, and its rejection of
# alg confusion must corroborate ours. Dev-dependency ONLY — protocol
# crates stay on RustCrypto.
jsonwebtoken = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "jws"
harness = false
