[package]
name = "mint-signed-examples"
description = "Mint cryptographically valid AITP example artifacts from the spec's pinned KAT keypairs (closes BLOCKED-SPEC-EXAMPLE / agentidentitytrustprotocol#5)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
aitp-core = { path = "../../crates/aitp-core", version = "0.6.0" }
aitp-crypto = { path = "../../crates/aitp-crypto", version = "0.6.0" }
aitp-manifest = { path = "../../crates/aitp-manifest", version = "0.6.0" }
aitp-tct = { path = "../../crates/aitp-tct", version = "0.6.0" }
aitp-delegation = { path = "../../crates/aitp-delegation", version = "0.6.0" }
aitp-session-bundle = { path = "../../crates/aitp-session-bundle", version = "0.6.0" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# Two binaries: `mint-signed-examples` writes the spec's committed
# signed-examples; `xcheck-mint` emits artifacts on stdout for the
# cross-implementation acceptance job to feed to an independent verifier.
[[bin]]
name = "mint-signed-examples"
path = "src/main.rs"

[[bin]]
name = "xcheck-mint"
path = "src/bin/xcheck_mint.rs"
