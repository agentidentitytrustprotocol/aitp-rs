# release-plz configuration.
#
# Published: `aitp`, `aitp-experimental` and `aitp-cli` (a binary,
# published so `cargo install aitp-cli` works). Everything else is test
# tooling or an example and must NOT be published.
#
# A crate whose own Cargo.toml sets `publish = false` must ALSO set
# `publish = false` here, or release-plz aborts with a "publish = false in
# Cargo.toml but publish = true in the release-plz configuration"
# consistency error.

[workspace]
# Run cargo-semver-checks inside release-plz when computing the release
# PR, so its version math sees API breaks too. The blocking gate is
# semver.yml on every pull request (STABILITY.md); this is the second
# look, where the version bumps actually happen.
semver_check = true

# Label the release PRs release-plz opens.
pr_labels = ["release"]

# Create a GitHub Release (tag + notes) for each published version.
git_release_enable = true

# Lockstep versioning (force-full-republish). `aitp-experimental` and
# `aitp-cli` pin the EXACT `aitp` version (`=x.y.z`), so a fresh resolver
# cannot mix release generations.
# Putting every published member in one `version_group` makes release-plz
# assign them all the same next version and bump the whole family together
# — even crates with no changes this cycle — so crates.io never holds a
# subset at a stale version. The version itself lives once in
# [workspace.package] and each member inherits it via
# `version.workspace = true`; `semver_check` above still guards real API
# breaks. `scripts/check-versions.sh` (the `versions` CI job) enforces the
# inheritance + exact-pin invariants on every PR. This mirrors the sibling
# acdp-rs release config.

[[package]]
name = "aitp"
version_group = "aitp"

[[package]]
name = "aitp-experimental"
version_group = "aitp"
# Held back until the 0.24.0 release PR, which removes this line: released
# before it, release-plz would publish aitp-experimental 0.23.0 against
# the aitp 0.23.0 on crates.io, which has none of the modules it uses. A
# new crate is otherwise published on the merge that adds it.
publish = false

[[package]]
name = "aitp-cli"
version_group = "aitp"

[[package]]
name = "aitp-conformance"
release = false
publish = false

[[package]]
name = "aitp-example-two-agents"
release = false
publish = false

[[package]]
name = "mint-signed-examples"
release = false
publish = false

[[package]]
name = "mint-conformance-fixtures"
release = false
publish = false
