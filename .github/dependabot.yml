version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      # One PR for minor+patch across the workspace; majors held separately.
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]
    ignore:
      # Held at 9.x: a dev-only test oracle, and 10+ needs a crypto
      # backend feature this workspace does not take (#98, Cargo.toml).
      - dependency-name: jsonwebtoken
        update-types: ["version-update:semver-major"]
      # 0.13 requires rustc 1.95, above the MSRV (1.90). Take it with the
      # next MSRV raise (STABILITY.md: raised only when a dependency forces it).
      - dependency-name: parking_lot
        versions: [">= 0.13"]

  - package-ecosystem: cargo
    directory: "/bindings/aitp-py"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  - package-ecosystem: cargo
    directory: "/bindings/aitp-node"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  - package-ecosystem: npm
    directory: "/bindings/aitp-node"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major-updates:
        update-types: ["major"]

  # The aitp-verifier-ts adapter that ci.yml's xcheck-ts job installs (#384).
  - package-ecosystem: npm
    directory: "/tests/xcheck-verifier-ts"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
