name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short
  # Excluded from tarpaulin's coverage denominator (the mint-* binaries
  # inflate the line count without contributing tests).
  COVERAGE_EXCLUDE_CRATES: "mint-signed-examples mint-conformance-fixtures aitp-example-two-agents aitp-cli"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Detect whether a PR touches Rust/build inputs. The heavy net-new jobs
  # below (conformance, wasm) gate on this so a docs-only PR skips them
  # instead of spending several minutes rebuilding the workspace — the
  # same gating `xcheck`/`e2e-llm-build` already use safely as required
  # checks (a job skipped via `if:` reports "skipped", which satisfies a
  # required status check; it's a job that never runs at all — e.g. a
  # typo'd name — that deadlocks branch protection). `test`/`coverage`
  # are not conditionally skipped at all — they always run — so there's
  # no skip semantics to reason about for those two. `cargo-semver-checks`
  # lives in semver.yml.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'tests/**'
              - 'scripts/**'
              - 'tools/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Every feature of the published library crates builds, lints and
  # passes its tests on its own: no features, each feature alone, and all
  # features (`cargo hack --each-feature`). The feature sets that promise
  # a small dependency graph keep it (scripts/check-dep-surface.sh).
  features:
    name: feature matrix
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-hack
      - name: dependency surface
        run: scripts/check-dep-surface.sh
      - name: clippy, each feature
        run: cargo hack clippy -p aitp -p aitp-experimental --each-feature --all-targets -- -D warnings
      - name: test, each feature
        run: cargo hack test -p aitp -p aitp-experimental --each-feature

  bindings-lint:
    name: bindings fmt + clippy
    runs-on: ubuntu-latest
    # The language bindings (bindings/aitp-py, bindings/aitp-node) are
    # excluded from the workspace, so the `fmt` and `clippy` jobs above do
    # NOT cover them. Lint them here — fmt + clippy only, no maturin/napi
    # wheel build, so no Python/Node toolchain is needed. The pyo3/napi
    # crates type-check (and pyo3's build script finds the runner's
    # preinstalled python3) without an extension build.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            bindings/aitp-py
            bindings/aitp-node
      - name: rustfmt — aitp-py
        run: cargo fmt --manifest-path bindings/aitp-py/Cargo.toml -- --check
      - name: rustfmt — aitp-node
        run: cargo fmt --manifest-path bindings/aitp-node/Cargo.toml -- --check
      - name: clippy — aitp-py
        run: cargo clippy --manifest-path bindings/aitp-py/Cargo.toml --all-targets --all-features -- -D warnings
      - name: clippy — aitp-node
        run: cargo clippy --manifest-path bindings/aitp-node/Cargo.toml --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: "1.90.0"   # MSRV gate — kept in lockstep with rust-toolchain.toml and rust-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-nextest
      - run: cargo build --workspace --all-targets --all-features
      # nextest is faster and gives clearer per-test output, but it does
      # NOT run doctests — those need a separate `cargo test --doc` pass.
      - run: cargo nextest run --workspace --all-features --no-fail-fast
      - run: cargo test --doc --workspace --all-features

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo doc --workspace --no-deps --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.90.0"
      # Installed explicitly instead of via rustsec/audit-check, which runs
      # a plain `cargo install cargo-audit`. Unlocked, cargo resolves
      # cargo-audit's dependencies to their newest semver-compatible
      # versions -- and one of those (kstring 2.0.4) now requires rustc
      # 1.96, above this repo's 1.90 MSRV pin. The tool then fails to BUILD
      # and the job goes red without ever auditing anything, which reads as
      # a security failure but is a toolchain-resolution failure.
      #
      # `--locked` makes cargo-audit's own committed lockfile govern its
      # dependency versions, which are chosen to build on older rustc.
      # Verified: `cargo install cargo-audit --locked` compiles under
      # 1.90.0 and `cargo audit` then scans cleanly.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit the dependency tree
        run: cargo audit

  # Lockstep-version guard: every published crate must inherit the
  # workspace version and every inter-crate path pin must match it, so a
  # release can never ship a subset of crates at a divergent version. Pure
  # shell — no toolchain needed.
  cli-install:
    # RS4.1 acceptance: `cargo install aitp-cli && aitp --version` on a
    # clean container. Installs from the checkout (the crates.io install
    # of each release is checked by cli-release.yml), with the MSRV
    # toolchain and the default features, i.e. the HTTP stack.
    name: cargo install aitp-cli (clean container)
    runs-on: ubuntu-latest
    container: rust:1.90-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - run: cargo install --locked --path crates/aitp-cli
      - run: aitp --version
      - run: aitp handshake --help

  versions:
    name: lockstep versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - run: ./scripts/check-versions.sh
      - run: ./scripts/check-docker-rust.sh

  interop-peer-docker:
    # RS4.2 acceptance: the interop peer's image builds and a client
    # completes `aitp enroll` -> `aitp echo` (handshake + PoP /echo) against
    # a local `docker run` of it.
    name: interop peer (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.90.0"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo build --locked -p aitp-cli
      - run: docker build -f deploy/interop-peer/Dockerfile -t aitp-interop-peer .
      - name: Run the peer
        run: |
          docker run -d --name peer -p 8080:8080 \
            -e AITP_PEER_KEY="$(target/debug/aitp keygen)" \
            -e AITP_PUBLIC_URL=http://localhost:8080 aitp-interop-peer
          for i in $(seq 1 30); do curl -fsS localhost:8080/status && exit 0; sleep 1; done
          docker logs peer; exit 1
      - name: enroll -> echo
        run: AITP=target/debug/aitp ./scripts/interop-peer-smoke.sh http://localhost:8080
      - if: always()
        run: docker logs peer || true

  public-api:
    name: aitp public API snapshot
    runs-on: ubuntu-latest
    # The curated facade surface (RS1.5) is frozen, with signatures, in
    # crates/aitp/public-api.{stable,experimental}.txt; any added, removed
    # or changed item fails here until they are regenerated with
    # `make public-api`. semver.yml decides whether a change is breaking.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (nightly)
        with:
          toolchain: nightly-2026-05-05
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-public-api
        run: cargo +nightly-2026-05-05 install --locked cargo-public-api@0.52.0
      - run: make public-api-check

  msrv:
    name: cargo-msrv (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-msrv
        # Install from outside the repo so rustup ignores the
        # rust-toolchain.toml pin (1.90) and uses the runner's stable
        # toolchain to compile cargo-msrv. The latest cargo-msrv
        # (≥0.19) requires rustc ≥1.91 and won't compile under 1.90.
        working-directory: /tmp
        run: cargo install --locked cargo-msrv
      - name: Verify pinned MSRV (1.90) still builds
        # cargo-msrv verify reads `package.rust-version` from a single
        # package manifest — it doesn't understand virtual workspaces.
        # Point it at the facade crate, which transitively depends on
        # every protocol crate via path deps. If `aitp` compiles under
        # 1.90, the whole workspace does.
        run: cargo msrv verify --manifest-path crates/aitp/Cargo.toml

  # Compile-only smoke test for the criterion benches (crates/*/benches/).
  # Not required yet — this catches a broken bench build without gating
  # merges on it; promote to required once it's proven stable in CI.
  bench-check:
    name: bench-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo bench -p aitp --no-run

  coverage:
    name: coverage (tarpaulin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Install cargo-tarpaulin
        # Install from outside the repo so the project's pinned MSRV
        # (1.90 in rust-toolchain.toml) doesn't gate the install. The
        # latest cargo-tarpaulin pulls in `cargo-platform` 0.3.x, which
        # requires rustc ≥1.91; the runner's stable toolchain handles it.
        working-directory: /tmp
        run: cargo install --locked cargo-tarpaulin
      - name: Build adapter binary
        # crates/aitp-conformance/tests/runner_integration.rs spawns
        # target/<profile>/aitp-rs-adapter as a subprocess. Plain
        # `cargo test --workspace` builds it as part of the workspace
        # graph, but tarpaulin's underlying `cargo test --no-run` only
        # produces test artifacts — bin targets that aren't a direct
        # test dep aren't built. Build it explicitly so the 12 runner
        # integration tests don't panic in adapter_path().
        run: cargo build -p aitp-conformance --bin aitp-rs-adapter
      - name: Run coverage with floor
        # Tarpaulin's --fail-under <pct> exits non-zero if total
        # workspace coverage drops below that threshold.
        #
        # Baseline measured on rc.1 (post-RFC sweep, 2026-05-04):
        # 52.6% workspace lines covered with the exclude list below.
        # The 50% floor leaves a ~2.5 pt buffer for normal variation
        # (test scheduling, ptrace skew on different runners) without
        # opening room for real regressions. Ratchet policy: raise the
        # floor in 5-pt steps as new tests land, toward an 80%-per-crate
        # target.
        #
        # Excludes: mint-* binaries and the example agent are
        # entry-point binaries with no in-binary tests; their lines
        # only inflate the denominator. aitp-conformance is included
        # because its integration tests exercise other crates'
        # public surface.
        # Note: each excluded crate needs its own --exclude flag.
        # `--exclude a b c` is parsed as one excluded value plus two
        # stray positionals. We expand the env-var space-separated
        # list into per-flag pairs at the shell layer so the exclude
        # set lives in exactly one place (the workflow-level env).
        run: |
          excludes=()
          for c in ${COVERAGE_EXCLUDE_CRATES}; do
            excludes+=(--exclude "$c")
          done
          cargo tarpaulin \
            --workspace --all-features --skip-clean --timeout 180 \
            "${excludes[@]}" \
            --out Xml --output-dir coverage --fail-under 50
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  spec-schemas:
    name: vendored schemas in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aitp-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          path: aitp-rs
      - name: Read pinned spec commit
        id: pin
        run: echo "sha=$(cat aitp-rs/tests/schemas/SPEC_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Checkout spec at pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: agentidentitytrustprotocol/agentidentitytrustprotocol
          path: spec
          ref: ${{ steps.pin.outputs.sha }}
      - name: Verify vendored schemas match pinned spec commit
        working-directory: aitp-rs
        run: |
          PIN="$(cat tests/schemas/SPEC_VERSION)"
          AITP_SPEC="$PWD/../spec" scripts/sync-schemas.sh
          # `--` includes deletions and untracked adds: sync-schemas.sh
          # MIRRORS (it clears the destination first), so a file removed
          # upstream shows as a deletion here. A copy-only sync left stale
          # files behind with a clean diff, making this check unable to fail.
          if ! git diff --quiet -- tests/schemas/ \
             || [ -n "$(git status --porcelain -- tests/schemas/)" ]; then
            echo "::error::Vendored schemas drift from pinned spec commit $PIN."
            echo "Run scripts/sync-schemas.sh locally and commit the result."
            git status --porcelain -- tests/schemas/
            git diff -- tests/schemas/
            exit 1
          fi

      # The spec ships its own known-answer verifier: ~630 lines of
      # dependency-free Node with an independent RFC 8785 JCS and JOSE
      # stack, an EXPECTED_MIN_CHECKS floor so it cannot pass vacuously,
      # and both the `signing_input` declaration rule and the wrapped-form
      # negatives. Running it against the pinned spec checkout, combined
      # with the byte-identity diff above, transitively certifies the
      # vendored tree using an implementation that shares no code with us.
      #
      # It proves the VECTORS are self-consistent; it can never prove
      # aitp-rs signs the right bytes. The Rust KATs and their negatives
      # (crates/aitp/tests/{core,tct,manifest}_*kat*.rs and
      # crates/aitp-experimental/tests/session_bundle_*kat*.rs) are what
      # cover that half.
      - name: Run the spec's own known-answer verifier
        working-directory: aitp-rs
        run: |
          CHECKER="../spec/scripts/verify-known-answer.mjs"
          if [ ! -f "$CHECKER" ]; then
            echo "::error::$CHECKER is missing from the pinned spec commit."
            echo "It may have been renamed or moved upstream; update this job."
            exit 1
          fi
          node "$CHECKER"

  conformance:
    name: conformance fixtures
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aitp-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          path: aitp-rs
      - name: Read pinned spec commit
        id: pin
        run: echo "sha=$(cat aitp-rs/tests/schemas/SPEC_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Checkout spec at pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: agentidentitytrustprotocol/agentidentitytrustprotocol
          path: spec
          ref: ${{ steps.pin.outputs.sha }}
          # Full history and tags: the conformance report's spec.version
          # is `git describe` of the pinned commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: aitp-rs
      - name: Build adapter + runner
        working-directory: aitp-rs
        run: cargo build -p aitp-conformance
      - name: No minting companion reaches the adapter (whole corpus)
        working-directory: aitp-rs
        # Walks every op request the runner sends, at every depth, for
        # every pinned fixture, and fails on any `*_claims` key.
        env:
          AITP_CONFORMANCE_FIXTURES: ${{ github.workspace }}/spec/schemas/conformance
        run: >-
          cargo test -p aitp-conformance --test runner_integration
          claims_companions_never_reach_the_adapter -- --nocapture
      - name: Run the core fixture corpus (strict, core gate)
        working-directory: aitp-rs
        # No --feature: the core gate (the default --profile) fails the
        # run if any required_for_core fixture FAILs or is SKIPped, e.g.
        # OP_NOT_SUPPORTED. Expected skips: the draft and extension
        # fixtures (docs/conformance.md). The counts are in the report
        # step's summary below.
        run: |
          ./target/debug/aitp-conformance run \
            --target ./target/debug/aitp-rs-adapter \
            --fixtures-dir ../spec/schemas/conformance
      - name: Run the full fixture corpus against the Rust adapter
        working-directory: aitp-rs
        # Opt into the draft features and extensions so the bundle-*,
        # multihop, spiffe, pinned-admission and self-attestation fixtures run
        # instead of being SKIPped. The runner exits non-zero if any
        # fixture FAILs or a required_for_core fixture is SKIPped.
        # Expected skips: del-004 and del-007, negated by multi-hop (the
        # runner lists del-007 as a gate exemption; see
        # docs/conformance.md).
        run: |
          ./target/debug/aitp-conformance run \
            --target ./target/debug/aitp-rs-adapter \
            --fixtures-dir ../spec/schemas/conformance \
            --feature experimental-multihop-delegation \
            --feature experimental-session-bundle \
            --feature experimental-spiffe-identity \
            --feature aitp-pinned-admission \
            --feature aitp-self-attestation
      - name: Write the conformance report (core + extension claims)
        working-directory: aitp-rs
        # No draft features: a core fixture negated by one (del-007
        # under multi-hop) is a skip that blocks the "AITP v0.3" claim
        # (spec docs/conformance-badge.md). Expected gates: AITP v0.3,
        # pinned-admission and self-attestation, all passed.
        run: |
          ./target/debug/aitp-conformance run \
            --target ./target/debug/aitp-rs-adapter \
            --fixtures-dir ../spec/schemas/conformance \
            --feature aitp-pinned-admission \
            --feature aitp-self-attestation \
            --spec-commit "${{ steps.pin.outputs.sha }}" \
            --implementation-commit "${{ github.sha }}" \
            --report conformance-report.json \
            --output tap > /dev/null
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check the report against the spec schema and checker
        working-directory: aitp-rs
        run: |
          python -m pip install --quiet jsonschema==4.23.0
          python - <<'PY'
          import json, os, sys
          from jsonschema import Draft202012Validator
          schema = json.load(open("tests/schemas/aitp-conformance-report.schema.json"))
          report = json.load(open("conformance-report.json"))
          errors = list(Draft202012Validator(schema).iter_errors(report))
          for e in errors:
              print(f"::error::{e.json_path}: {e.message}")
          gates = {g["name"]: g["passed"] for g in report["gates"]}
          print("gates:", gates)
          # The fixture counts, derived from the run (docs quote none).
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              spec = report["spec"]
              out.write(f"### Conformance report (spec {spec['commit'][:7]}, {spec['version']})\n\n")
              out.write("| Tier | pass | fail | skip |\n|---|---|---|---|\n")
              for tier, t in report["totals"].items():
                  out.write(f"| {tier} | {t['pass']} | {t['fail']} | {t['skip']} |\n")
              out.write("\n| Claim | Passed | Blocking |\n|---|---|---|\n")
              for g in report["gates"]:
                  out.write(f"| {g['name']} | {g['passed']} | {', '.join(g.get('blocking', []))} |\n")
          if errors or not all(gates.values()):
              sys.exit(1)
          PY
          python ../spec/scripts/check-conformance-report.py conformance-report.json \
            --fixtures-dir ../spec/schemas/conformance
      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-report
          path: aitp-rs/conformance-report.json
          if-no-files-found: error

  xcheck:
    name: cross-impl acceptance (aitp-verifier-py)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aitp-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          path: aitp-rs
      - name: Read pinned aitp-verifier-py commit
        id: pin
        run: echo "sha=$(cat aitp-rs/tests/AITP_VERIFIER_PY_VERSION)" >> "$GITHUB_OUTPUT"
      # Pinned by SHA, never a floating ref: this job is a required check,
      # so an unpinned dependency would let an upstream change break every
      # merge here. Bumping the pin is a deliberate commit;
      # bump-verifier-py.yml opens that PR weekly when verifier main moves.
      - name: Checkout aitp-verifier-py at pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: agentidentitytrustprotocol/aitp-verifier-py
          path: aitp-verifier-py
          ref: ${{ steps.pin.outputs.sha }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: aitp-rs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install the independent verifier
        run: python -m pip install ./aitp-verifier-py
      # aitp-rs mints; an implementation written from the RFC texts alone,
      # sharing no code with this workspace, verifies THOSE EXACT BYTES.
      #
      # Nothing is re-signed on either side. Re-minting is what hid the
      # wrapped-vs-inner divergence for a full release: each stack re-signed
      # under its own convention and verified its own output, so both
      # reported 51/51 while their wire formats disagreed. Note the existing
      # `interop (python <-> node)` job cannot substitute for this -- both
      # bindings wrap the same Rust core.
      - name: Mint with aitp-rs, verify with aitp-verifier-py
        working-directory: aitp-rs
        run: |
          cargo run --quiet -p mint-signed-examples --bin xcheck-mint \
            | python3 scripts/xcheck-verify.py
      # RS3.2: the verifier's own conformance adapter, through our runner,
      # on the fixtures the `conformance` job runs. It comes from PyPI at
      # the exact version in tests/xcheck-verifier-requirements.txt, in its
      # own venv so it never mixes with the pinned checkout above.
      - name: Read pinned spec commit
        id: spec
        run: echo "sha=$(cat aitp-rs/tests/schemas/SPEC_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Checkout spec at pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: agentidentitytrustprotocol/agentidentitytrustprotocol
          path: spec
          ref: ${{ steps.spec.outputs.sha }}
          # The reports' spec.version is `git describe` of the pin.
          fetch-depth: 0
      - name: Install the verifier's adapter from PyPI
        run: |
          python -m venv vpy
          vpy/bin/pip install --quiet -r aitp-rs/tests/xcheck-verifier-requirements.txt
          printf '#!/bin/sh\nexec "%s/vpy/bin/python" -m aitp_verifier.adapter\n' \
            "$GITHUB_WORKSPACE" > vpy-adapter
          chmod +x vpy-adapter
      - name: Build adapter + runner
        working-directory: aitp-rs
        run: cargo build -p aitp-conformance
      # Core profile, no features, for both. The runner exits non-zero on
      # any FAIL; the comparison below is the gate, so it runs either way.
      - name: Run the fixtures against both adapters
        working-directory: aitp-rs
        # No AITP_SPEC: both adapters carry the KAT keys they need, so this
        # also proves the PyPI install works on its own.
        run: |
          for t in rs:./target/debug/aitp-rs-adapter py:../vpy-adapter; do
            ./target/debug/aitp-conformance run \
              --target "${t#*:}" \
              --fixtures-dir ../spec/schemas/conformance \
              --spec-commit "${{ steps.spec.outputs.sha }}" \
              --report "${t%%:*}-report.json" \
              --output tap > /dev/null || true
          done
      # Gate: the verifier passes the AITP v0.3 core claim and agrees with
      # aitp-rs on every fixture. A divergence the verifier cannot fix yet
      # goes in as `--known-divergence <id>` with a comment citing the bug;
      # an entry that stops diverging fails the job, so the list only
      # shrinks. There are none.
      - name: aitp-verifier-py agrees with aitp-rs
        working-directory: aitp-rs
        run: python3 scripts/xcheck-compare-reports.py rs-report.json py-report.json
      - name: Upload the verifier's conformance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcheck-py-report
          path: |
            aitp-rs/py-report.json
            aitp-rs/rs-report.json
          if-no-files-found: error

  # RS4.3 (#308): the same two checks as `xcheck`, against the TypeScript
  # verifier, which shares no code with this repo or with aitp-verifier-py.
  # It is unpublished, so it is pinned by commit SHA in
  # tests/AITP_VERIFIER_TS_VERSION and built from that checkout; its adapter
  # also reads the OIDC test-issuer keys from the checkout's vendor/spec.
  # A required check, like `xcheck` (DECISIONS.md D3); bump-verifier-ts.yml
  # opens the PR that moves the pin.
  xcheck-ts:
    name: cross-impl acceptance (aitp-verifier-ts)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aitp-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          path: aitp-rs
      - name: Read pinned commits
        id: pin
        run: |
          echo "ts=$(cat aitp-rs/tests/AITP_VERIFIER_TS_VERSION)" >> "$GITHUB_OUTPUT"
          echo "spec=$(cat aitp-rs/tests/schemas/SPEC_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Checkout aitp-verifier-ts at pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: agentidentitytrustprotocol/aitp-verifier-ts
          path: aitp-verifier-ts
          ref: ${{ steps.pin.outputs.ts }}
      - name: Checkout spec at pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: agentidentitytrustprotocol/agentidentitytrustprotocol
          path: spec
          ref: ${{ steps.pin.outputs.spec }}
          # The reports' spec.version is `git describe` of the pin.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: aitp-rs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build the independent verifier
        working-directory: aitp-verifier-ts
        run: npm ci && npm run build
      # aitp-rs mints; the TS verifier verifies those exact bytes. Nothing
      # is re-signed on either side (see the comment in `xcheck`).
      - name: Mint with aitp-rs, verify with aitp-verifier-ts
        working-directory: aitp-rs
        run: |
          cargo run --quiet -p mint-signed-examples --bin xcheck-mint \
            | node ../aitp-verifier-ts/scripts/xcheck-verify.mjs
      - name: Build adapter + runner
        working-directory: aitp-rs
        run: cargo build -p aitp-conformance
      # Core profile, no features, for both. The comparison below is the
      # gate, so the runs never fail the step themselves.
      - name: Run the fixtures against both adapters
        working-directory: aitp-rs
        run: |
          for t in rs:./target/debug/aitp-rs-adapter \
                   ts:../aitp-verifier-ts/bin/aitp-verifier-adapter.mjs; do
            ./target/debug/aitp-conformance run \
              --target "${t#*:}" \
              --fixtures-dir ../spec/schemas/conformance \
              --spec-commit "${{ steps.pin.outputs.spec }}" \
              --report "${t%%:*}-report.json" \
              --output tap > /dev/null || true
          done
      # Same gate as `xcheck`: the core claim passes and every fixture
      # agrees. There are no known divergences.
      - name: aitp-verifier-ts agrees with aitp-rs
        working-directory: aitp-rs
        run: |
          python3 scripts/xcheck-compare-reports.py rs-report.json ts-report.json \
            --verifier aitp-verifier-ts
      - name: Upload the verifier's conformance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcheck-ts-report
          path: |
            aitp-rs/ts-report.json
            aitp-rs/rs-report.json
          if-no-files-found: error

  wasm:
    name: wasm portability check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # Pin to 1.90.0 (matching rust-toolchain.toml) and install the wasm
      # target for THAT toolchain. Installing it for `stable` would miss:
      # rust-toolchain.toml overrides cargo to 1.90.0 inside the repo, and
      # 1.90.0 auto-installs with a minimal profile (no wasm target),
      # yielding `can't find crate for core` (E0463).
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.90.0"
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      # Guards the "pure crates stay portable" invariant: no native-only
      # syscall dependency may creep into the protocol modules (everything
      # in `aitp` without the HTTP features) or `aitp-experimental`.
      # Target is wasm32-wasip1 (has a randomness source). Full browser
      # wasm32-unknown-unknown additionally needs a uuid rng feature —
      # tracked as a gated decision in plans/defered/deferred.md.
      - name: cargo check --target wasm32-wasip1 (no HTTP features)
        run: |
          cargo check -p aitp --no-default-features --features pinned-admission --target wasm32-wasip1
          cargo check -p aitp-experimental --target wasm32-wasip1

  e2e-llm-build:
    name: tier-3 e2e build (no API calls)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # `tests/e2e-llm` is excluded from the workspace (it talks to live
    # LLM provider APIs), so `fmt`, `clippy` and `test` above do NOT
    # cover it — exactly the same blind spot `bindings-lint` exists to
    # close for bindings/*.
    #
    # It was uncovered until 0.5.0, and it rotted: the package stopped
    # compiling at the 0.4.0 breaking release and nobody found out for
    # two releases, because nothing ever built it. A test suite no job
    # compiles is indistinguishable from one that does not exist.
    #
    # This job builds and lints it, then RUNS it with the master gate
    # unset — every test takes its skip branch and exits 0, which costs
    # no API credits but does prove the harness links, boots, and that
    # the skip gate itself still works.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: tests/e2e-llm
      - name: rustfmt — tests/e2e-llm
        run: cargo fmt --manifest-path tests/e2e-llm/Cargo.toml -- --check
      - name: clippy — tests/e2e-llm
        run: cargo clippy --manifest-path tests/e2e-llm/Cargo.toml --all-targets -- -D warnings
      # Explicitly unset so a provider key leaking into the environment
      # can never turn this into a billed run.
      - name: cargo test (skip gate engaged — no provider is contacted)
        env:
          AITP_RUN_LLM_TESTS: "0"
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: cargo test --manifest-path tests/e2e-llm/Cargo.toml -- --nocapture

  # Documentation drift guard (scripts/check-docs.py): relative links and
  # GitHub anchors, every `RFC-AITP-NNNN §x.y` citation against the spec at
  # the PINNED commit (tests/schemas/SPEC_VERSION, checked out exactly as the
  # `conformance` job does), protected inbound anchors other repos link to,
  # banned stale strings, and MDX hazards for the website sync.
  #
  # NOT a required check (plan decision D2): do not add it to branch
  # protection until it has proven quiet. Deliberately unfiltered by
  # `changes` -- it takes seconds, and a Rust-only PR that renames or
  # deletes a file the docs link to must still be caught.
  docs-check:
    name: docs-check (links, anchors, § citations)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aitp-rs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          path: aitp-rs
      - name: Read pinned spec commit
        id: pin
        run: echo "sha=$(cat aitp-rs/tests/schemas/SPEC_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Checkout spec at pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: agentidentitytrustprotocol/agentidentitytrustprotocol
          path: spec
          ref: ${{ steps.pin.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Self-test the checker
        working-directory: aitp-rs
        run: python3 -m unittest discover -s scripts/tests -v
      - name: make docs-check
        working-directory: aitp-rs
        env:
          AITP_SPEC: ${{ github.workspace }}/spec
        run: make docs-check
