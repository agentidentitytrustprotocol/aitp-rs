name: release-bindings

# Lockstep the SDK bindings with the crate release. release-plz tags the
# top-level `aitp` crate as `aitp-v<X.Y.Z>` when it publishes; this workflow
# reacts to that tag and cuts the npm + PyPI binding releases at the SAME
# version by pushing `aitp-node-v<X.Y.Z>` and `aitp-py-v<X.Y.Z>` (which trigger
# bindings-release.yml / aitp-py-release.yml).
#
# The bindings carry their own manifest versions (bindings/aitp-node/package.json
# + Cargo.toml, bindings/aitp-py/pyproject.toml + Cargo.toml). They used to drift
# from the workspace crates silently — up to 5 releases' worth (0.5.0 committed
# vs. 0.10.0 published) — because release-plz can't reach them (both bindings are
# excluded from the Cargo workspace) and nothing else kept them in sync. Two
# things fixed that:
#   - scripts/check-versions.sh's `lockstep versions` CI check now FAILS any PR
#     (including release-plz's own release PRs) where a binding manifest
#     disagrees with the workspace version.
#   - release-plz.yml appends a binding-version-sync commit to its own release
#     PR branch before that PR is merged.
# So **main being in lockstep is now the expected steady state**: by the time
# this workflow runs, every binding manifest should already declare the release
# version, and the normal path below is just tagging `$GITHUB_SHA` as-is.
#
# The OLD behavior — stamping a detached commit that bumps the manifests to the
# release version, kept OFF `main` (main is branch-protected; the tag just needs
# a commit that carries the right version, it doesn't have to live on a branch)
# — still exists, but only as an explicit opt-in escape hatch
# (workflow_dispatch `stamp: true`) for the day lockstep breaks anyway (e.g. the
# release-plz.yml sync step failed silently, or someone bypassed it). Without
# `stamp: true`, an out-of-lockstep manifest now fails the job loudly instead of
# silently drifting again — see the `stamp` input and the `tag_binding` function
# below.
#
# A binding whose `<prefix>-v<X.Y.Z>` tag already exists is skipped, so a release
# at a version the bindings already shipped (e.g. the current 0.4.1) won't try to
# republish. Auth: the aitp-deps-bot App token (no PAT).
#
# The version each manifest declares is asserted either way, so a tag never
# claims a version its manifests don't carry.

on:
  push:
    tags:
      - 'aitp-v*'   # release-plz's tag for the top-level `aitp` crate only
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag the bindings at (e.g. 0.4.2)'
        required: true
      stamp:
        description: >-
          Escape hatch: if the binding manifests do NOT already declare
          `version` (main should normally already be in lockstep — see the
          header comment), stamp them on a detached commit and tag that
          instead of failing the job. Leave false unless you know lockstep is
          broken and you need this release cut anyway.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tag-bindings:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AITP_BOT_APP_ID }}
          private-key: ${{ secrets.AITP_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Resolve release version
        id: v
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#aitp-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag npm + PyPI bindings in lockstep
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          V: ${{ steps.v.outputs.version }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          STAMP: ${{ github.event.inputs.stamp }}
        run: |
          set -euo pipefail
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          BASE="$GITHUB_SHA"

          set_ver() { # $1 = file (Cargo.toml / pyproject.toml): replace first line-anchored version
            V="$V" perl -0777 -i -pe 's/^(version\s*=\s*")[^"]+(")/${1}$ENV{V}${2}/m' "$1"
          }

          read_ver() { # $1 = file: echo the version the file currently declares
            case "$1" in
              *package.json)
                node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).version)' "$1" ;;
              *) perl -0777 -ne 'print $1 if /^version\s*=\s*"([^"]+)"/m' "$1" ;;
            esac
          }

          assert_ver() { # $1 = file: the stamp must have landed, or the tag would lie
            local got; got="$(read_ver "$1")"
            if [ "$got" != "$V" ]; then
              echo "::error::$1 declares version '$got', expected '$V' — the version stamp did not apply (manifest layout changed?)"
              exit 1
            fi
          }

          tag_binding() { # $1 = tag prefix (aitp-node|aitp-py); $2.. = manifest files to stamp
            local prefix="$1"; shift
            local tag="${prefix}-v${V}"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::notice::$tag already exists — skipping (bindings already shipped $V)"; return 0
            fi
            git checkout -q --detach "$BASE"

            # Steady state (see header comment): release-plz.yml's
            # binding-version-sync step already landed $V on main's release
            # PR before merge, so the manifests here normally ALREADY declare
            # $V and there is nothing to stamp — just tag $BASE as-is.
            local synced=1
            for f in "$@"; do
              if [ "$(read_ver "$f")" != "$V" ]; then
                synced=0
                break
              fi
            done

            if [ "$synced" -eq 1 ]; then
              echo "::notice::$prefix manifests already declare $V — tagging $BASE as-is"
            elif [ "$STAMP" = "true" ]; then
              echo "::warning::$prefix manifests do not declare $V — stamp=true escape hatch: stamping a detached commit instead of failing"
              for f in "$@"; do
                case "$f" in
                  *package.json)
                    V="$V" node -e 'const fs=require("fs");const p=process.argv[1];const j=JSON.parse(fs.readFileSync(p,"utf8"));j.version=process.env.V;fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n")' "$f" ;;
                  *) set_ver "$f" ;;
                esac
                git add "$f"
              done
              git commit -q -m "chore(release): $prefix v$V (lockstep with aitp crate)"
            else
              echo "::error::$prefix manifests do not declare $V and main is out of lockstep. This should not happen — main is expected to always carry the release version (release-plz.yml syncs it onto the release PR before merge; scripts/check-versions.sh's 'lockstep versions' CI check enforces it on every PR). Run 'make sync-versions' (scripts/sync-binding-versions.sh) against the release PR and re-merge, or re-run this workflow_dispatch with stamp=true as a one-off escape hatch if you need this release cut anyway."
              exit 1
            fi

            for f in "$@"; do
              assert_ver "$f"
            done
            git tag "$tag"
            git push origin "$tag"
            echo "pushed $tag"
          }

          tag_binding aitp-node bindings/aitp-node/package.json bindings/aitp-node/Cargo.toml
          tag_binding aitp-py   bindings/aitp-py/pyproject.toml   bindings/aitp-py/Cargo.toml
