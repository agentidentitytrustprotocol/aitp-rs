name: bindings

# CI for the language bindings (excluded from the Rust workspace, so the
# main `ci.yml` only fmt+clippy-checks them — it never builds the wheel /
# native addon). This workflow actually BUILDS each SDK and runs its test
# suite, plus the cross-language interop suite, so binding breakage is
# caught on PRs instead of at release time.
#
# Built with default features, which now cover the full surface (pinning,
# renewal, session bundle, p256, multihop) — the same surface the RELEASE
# workflows ship. See bindings-release.yml / aitp-py-release.yml.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'bindings/**'
      - 'scripts/interop.sh'
      - '.github/workflows/bindings.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'bindings/**'
      - 'scripts/interop.sh'
      - '.github/workflows/bindings.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Runs once (not matrixed) since it only inspects Cargo.lock, not the
  # built artifact — matches ci.yml's dedicated (non-matrixed) deny/audit
  # jobs for the main workspace. Each binding excludes the workspace and
  # carries its own Cargo.lock, which Dependabot/cargo-deny previously
  # never saw at all, even though these lockfiles are what ships on PyPI/npm.
  bindings-deny:
    name: bindings cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          manifest-path: bindings/aitp-py/Cargo.toml
          arguments: --all-features
          command-arguments: --config deny.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          manifest-path: bindings/aitp-node/Cargo.toml
          arguments: --all-features
          command-arguments: --config deny.toml

  bindings-audit:
    name: bindings cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.90.0"
      # See ci.yml's `audit` job for why this is an explicit `--locked`
      # install rather than rustsec/audit-check.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # RUSTSEC-2025-0020 / RUSTSEC-2026-0177: tracked pyo3 0.22 advisories
      # with no fix in the 0.22.x line, mirroring deny.toml's ignore list.
      # See https://github.com/agentidentitytrustprotocol/aitp-rs/issues/104.
      - name: Audit aitp-py
        run: cargo audit --file bindings/aitp-py/Cargo.lock --ignore RUSTSEC-2025-0020 --ignore RUSTSEC-2026-0177
      - name: Audit aitp-node
        run: cargo audit --file bindings/aitp-node/Cargo.lock

  aitp-py:
    name: aitp-py (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # Standalone [workspace] in the binding's Cargo.toml, so a
          # separate cache key keeps its target/ from competing with the
          # root crate's.
          workspaces: bindings/aitp-py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # `maturin develop` requires an active venv — it refuses to install
      # into the bare hosted-tool Python. Create one and promote it into
      # PATH + VIRTUAL_ENV for every subsequent step.
      - name: Create and activate venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install maturin + test deps
        # pyjwt[crypto] + cryptography back the OIDC identity test (mock
        # IdP signs Ed25519 JWTs in-process); httpx backs the transport
        # tests. Mirrors the `dev` extra in pyproject.toml.
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.5,<2.0' pytest httpx 'pyjwt[crypto]>=2.8' 'cryptography>=41'
      - name: Build the wheel (editable, full surface)
        working-directory: bindings/aitp-py
        run: maturin develop --release
      - name: pytest
        working-directory: bindings/aitp-py
        run: pytest tests/ -v

  aitp-node:
    name: aitp-node (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: bindings/aitp-node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        working-directory: bindings/aitp-node
        run: npm install
      - name: Build the native binary (full surface)
        working-directory: bindings/aitp-node
        run: npm run build:debug
      # build:debug regenerates index.d.ts from the napi-rs macros. The
      # committed file is what npm consumers actually get typed against,
      # so a signature change that isn't reflected here ships correct
      # runtime behavior with stale types.
      - name: index.d.ts is up to date
        working-directory: bindings/aitp-node
        run: git diff --exit-code index.d.ts
      - name: node --test
        working-directory: bindings/aitp-node
        # Explicit glob: Node 22+ treats `--test tests/` as a module path
        # (MODULE_NOT_FOUND) instead of recursing into the dir.
        run: node --test tests/*.mjs

  interop:
    name: interop (python ↔ node)
    runs-on: ubuntu-latest
    needs: [aitp-py, aitp-node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            bindings/aitp-py
            bindings/aitp-node
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # scripts/interop.sh creates its own venv, installs maturin/pytest/
      # pyjwt/cryptography, builds both SDKs with default (full) features,
      # then drives a real four-message handshake between them.
      - name: Cross-language interop
        run: make interop
