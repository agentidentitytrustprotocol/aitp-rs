name: bindings

# CI for the language bindings (excluded from the Rust workspace, so the
# main `ci.yml` only fmt+clippy-checks them — it never builds the wheel /
# native addon). This workflow actually BUILDS each SDK and runs its test
# suite, plus the cross-language interop suite, so binding breakage is
# caught on PRs instead of at release time.
#
# The aitp-py / aitp-node jobs build default features, the surface the
# release workflows ship (bindings-release.yml / aitp-py-release.yml), and
# check that it exports exactly its API snapshot (scripts/binding-api.py). The *-experimental jobs build
# `--features experimental` with AITP_EXPECT_EXPERIMENTAL=1, so a test of
# an experimental feature fails instead of skipping.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'bindings/**'
      - 'scripts/interop.sh'
      - 'docs/sdk-python.md'
      - 'docs/sdk-node.md'
      - '.github/workflows/bindings.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'bindings/**'
      - 'scripts/interop.sh'
      - 'docs/sdk-python.md'
      - 'docs/sdk-node.md'
      - '.github/workflows/bindings.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Runs once (not matrixed) since it only inspects Cargo.lock, not the
  # built artifact — matches ci.yml's dedicated (non-matrixed) deny/audit
  # jobs for the main workspace. Each binding excludes the workspace and
  # carries its own Cargo.lock, which Dependabot/cargo-deny previously
  # never saw at all, even though these lockfiles are what ships on PyPI/npm.
  bindings-deny:
    name: bindings cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          manifest-path: bindings/aitp-py/Cargo.toml
          arguments: --all-features
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          manifest-path: bindings/aitp-node/Cargo.toml
          arguments: --all-features

  bindings-audit:
    name: bindings cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.90.0"
      # See ci.yml's `audit` job for why this is an explicit `--locked`
      # install rather than rustsec/audit-check.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit aitp-py
        run: cargo audit --file bindings/aitp-py/Cargo.lock
      - name: Audit aitp-node
        run: cargo audit --file bindings/aitp-node/Cargo.lock

  aitp-py:
    name: aitp-py (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          # Standalone [workspace] in the binding's Cargo.toml, so a
          # separate cache key keeps its target/ from competing with the
          # root crate's.
          workspaces: bindings/aitp-py
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # `maturin develop` requires an active venv — it refuses to install
      # into the bare hosted-tool Python. Create one and promote it into
      # PATH + VIRTUAL_ENV for every subsequent step.
      - name: Create and activate venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install maturin + test deps
        # pyjwt[crypto] + cryptography back the OIDC identity test (mock
        # IdP signs Ed25519 JWTs in-process); httpx backs the transport
        # tests. Mirrors the `dev` extra in pyproject.toml.
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.5,<2.0' pytest httpx 'pyjwt[crypto]>=2.8' 'cryptography>=41'
      - name: Build the wheel (editable, default features)
        working-directory: bindings/aitp-py
        run: maturin develop --release
      - name: The default build exports exactly its API snapshot
        run: python scripts/binding-api.py runtime --python python
      - name: pytest
        working-directory: bindings/aitp-py
        run: pytest tests/ -v -rs

  aitp-py-experimental:
    name: aitp-py experimental (python 3.13)
    runs-on: ubuntu-latest
    env:
      AITP_EXPECT_EXPERIMENTAL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: bindings/aitp-py
          key: experimental
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Create and activate venv
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install maturin + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.5,<2.0' pytest httpx 'pyjwt[crypto]>=2.8' 'cryptography>=41'
      - name: Build the wheel (editable, --features experimental)
        working-directory: bindings/aitp-py
        run: maturin develop --release --features experimental
      - name: pytest
        working-directory: bindings/aitp-py
        run: pytest tests/ -v -rs

  aitp-node:
    name: aitp-node (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: bindings/aitp-node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        working-directory: bindings/aitp-node
        run: npm ci
      - name: Build the native binary (default features)
        working-directory: bindings/aitp-node
        run: npm run build:debug
      # build:debug regenerates index.js and index.d.ts from the napi-rs
      # macros. Both are committed and published verbatim to npm — index.d.ts
      # is what consumers get typed against, and napi-rs 3's CLI now bakes
      # package.json's version into index.js (NAPI_RS_ENFORCE_VERSION_CHECK),
      # so a stale index.js can silently drift from the published version too.
      - name: index.js / index.d.ts are up to date
        working-directory: bindings/aitp-node
        run: git diff --exit-code index.js index.d.ts
      - name: The default build exports exactly its API snapshot
        run: python3 scripts/binding-api.py runtime --node
      - name: node --test
        working-directory: bindings/aitp-node
        # Explicit glob: Node 22+ treats `--test tests/` as a module path
        # (MODULE_NOT_FOUND) instead of recursing into the dir.
        run: node --test tests/*.mjs

  aitp-node-experimental:
    name: aitp-node experimental (node 22)
    runs-on: ubuntu-latest
    env:
      AITP_EXPECT_EXPERIMENTAL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: bindings/aitp-node
          key: experimental
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: bindings/aitp-node
        run: npm ci
      # Writes experimental.js and experimental.d.ts; index.js and
      # index.d.ts stay the default build's.
      - name: Build the native binary (--features experimental)
        working-directory: bindings/aitp-node
        run: npm run build:experimental
      - name: experimental.js / experimental.d.ts are up to date, index.* untouched
        working-directory: bindings/aitp-node
        run: git diff --exit-code experimental.js experimental.d.ts index.js index.d.ts
      - name: node --test
        working-directory: bindings/aitp-node
        run: node --test tests/*.mjs

  interop:
    name: interop (python ↔ node)
    runs-on: ubuntu-latest
    needs: [aitp-py, aitp-node]
    # The session-bundle case needs the experimental features.
    env:
      AITP_BINDING_FEATURES: experimental
      AITP_EXPECT_EXPERIMENTAL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (stable)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: |
            bindings/aitp-py
            bindings/aitp-node
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      # scripts/interop.sh creates its own venv, installs maturin/pytest/
      # pyjwt/cryptography, builds both SDKs with AITP_BINDING_FEATURES,
      # then drives a real four-message handshake between them.
      - name: Cross-language interop
        run: make interop
