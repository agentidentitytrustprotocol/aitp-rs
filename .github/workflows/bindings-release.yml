name: bindings-release

# Publishes the `@agentidentitytrustprotocol/aitp` Node.js SDK (NAPI
# prebuilts) to npm, and attaches the native `.node` binaries to a GitHub
# Release.
#
# Trigger: push a tag of the form `aitp-node-v0.2.0`. The job matrix
# cross-builds the native `.node` for every target in
# `bindings/aitp-node/package.json`'s `napi.triples`, then a single
# publish job assembles the per-platform npm packages
# (`@agentidentitytrustprotocol/aitp-darwin-arm64`, …) plus the loader
# package (`@agentidentitytrustprotocol/aitp`) via `napi prepublish` and
# `npm publish`.
#
# Built with default features: the stable surface plus SPKI pinning. The
# experimental features are not published (STABILITY.md).
#
# Targets: macOS x86_64/arm64, Linux glibc x86_64/arm64 and Linux musl
# x86_64/arm64. The musl addons are built natively in an Alpine container
# on the matching runner. Windows is built on demand only (STABILITY.md).
#
# On a pull request touching the binding, the workflow is a dry run: it
# builds and smoke-tests every target and assembles the npm package dirs,
# and publishes nothing.
#
# Requires repo secret `NPM_TOKEN`: an npm automation token with publish
# rights to the `@agentidentitytrustprotocol` scope. The tag version must
# match `version` in package.json and Cargo.toml.

on:
  push:
    tags:
      - 'aitp-node-v*'
  pull_request:
    paths:
      - 'bindings/aitp-node/**'
      - 'scripts/binding-api.py'
      - '.github/workflows/bindings-release.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only; skip npm publish + GitHub release'
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: bindings/aitp-node

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        # napi cross-compiling tripped over the repo's 1.90.0 toolchain
        # pin (the cross target's std landed on `stable`, not 1.90.0)
        # and the zig path. The toolchain step below now pins 1.90.0 and
        # adds the target's std there, so the macOS x86_64 cross (arm ->
        # x86, same OS) builds reliably without a scarce Intel runner.
        # Linux arm64 builds on a native `ubuntu-24.04-arm` runner (free
        # for public repos) — cross-assembling `ring` for aarch64 from
        # x86 is the part that doesn't work.
        include:
          - target: x86_64-apple-darwin
            host: macos-latest      # cross arm -> x86 (std pinned below)
          - target: aarch64-apple-darwin
            host: macos-latest      # native Apple silicon
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-24.04-arm  # native arm64
          - target: x86_64-unknown-linux-musl
            host: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-musl
            host: ubuntu-24.04-arm  # native arm64
            musl: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !matrix.musl }}
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: ${{ !matrix.musl }}
        with:
          toolchain: "1.90.0"        # match rust-toolchain.toml
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        if: ${{ !matrix.musl }}
        with:
          workspaces: bindings/aitp-node
      - name: Install dependencies
        if: ${{ !matrix.musl }}
        run: npm ci
      - name: Build (native)
        if: ${{ !matrix.musl }}
        run: npx napi build --platform --release --target ${{ matrix.target }}
      # Alpine is the musl host, so the build is native there. The addon
      # must link the C runtime dynamically to load as a shared object:
      # `-crt-static`. napi would pick a cross linker (`<arch>-linux-musl-gcc`)
      # for the target; the native `gcc` is the right one here. The same
      # container smoke-loads it and checks it exports exactly its API
      # snapshot.
      - name: Build and smoke-test (musl, in Alpine)
        if: ${{ matrix.musl }}
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w/bindings/aitp-node \
            -e TARGET=${{ matrix.target }} node:22-alpine sh -euxc '
              apk add --no-cache build-base curl python3
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.90.0
              . "$HOME/.cargo/env"
              npm ci
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=gcc CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=gcc
              RUSTFLAGS="-C target-feature=-crt-static" npx napi build --platform --release --target "$TARGET"
              node -e "require(\"./index.js\"); console.log(\"addon loads\")"
              python3 ../../scripts/binding-api.py runtime --node
            '
      # Load the built addon before it can publish: a release-profile
      # binary that links but fails to dlopen (e.g. a mis-aligned
      # LINKEDIT from stripping) must fail here, not on users' machines.
      # It then checks the addon exports exactly its API snapshot. The x86_64
      # macOS addon is cross-built on an arm runner, so it is not loadable
      # here; it has only the static check (ci.yml) and the default
      # features of Cargo.toml.
      - name: Smoke-load the addon
        if: ${{ matrix.target != 'x86_64-apple-darwin' && !matrix.musl }}
        run: |
          node -e "require('./index.js'); console.log('addon loads')"
          python3 ../../scripts/binding-api.py runtime --node
      - name: Upload .node artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.target }}
          path: bindings/aitp-node/*.node
          if-no-files-found: error

  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Download all .node artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: bindings/aitp-node/artifacts
          pattern: bindings-*
          merge-multiple: true
      - name: Scaffold per-platform npm package dirs
        run: npx napi create-npm-dirs
      - name: Assemble per-platform npm dirs
        run: npx napi artifacts --output-dir artifacts
      - name: List what will be published
        run: ls -R npm && ls -la *.node 2>/dev/null || true
      # `napi prepublish` only publishes the per-platform binary packages
      # (@agentidentitytrustprotocol/aitp-darwin-arm64, …). It does NOT
      # publish the root loader package — that needs `npm publish`. Do
      # both, as two steps.
      - name: Publish platform packages
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: npx napi prepublish -t npm --no-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      # The committed package.json lists no prebuilt-binary packages, so a
      # release PR's lockfile never names an unpublished version. The root
      # package must list every one of them: `napi prepublish` writes them,
      # and this step writes them again from the per-platform dirs, so a
      # re-run whose prepublish step failed early still publishes them.
      - name: Pin every platform package in the root package.json
        if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
        run: |
          # shellcheck disable=SC2016  # the JavaScript template literals are not shell
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const dirs = fs.readdirSync("npm");
            const deps = {};
            for (const d of dirs) {
              const p = JSON.parse(fs.readFileSync(`npm/${d}/package.json`, "utf8"));
              if (p.version !== pkg.version) throw new Error(`${p.name} is ${p.version}, not ${pkg.version}`);
              deps[p.name] = pkg.version;
            }
            if (dirs.length !== pkg.napi.targets.length) throw new Error(`${dirs.length} platform dirs for ${pkg.napi.targets.length} targets`);
            pkg.optionalDependencies = deps;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log(deps);
          '
      # `if: always()` so re-running a partially-completed release (where
      # the platform packages already exist and the step above errors with
      # "cannot publish over existing version") still publishes the root.
      # `--ignore-scripts` stops npm from re-running `prepublishOnly`
      # (which is `napi prepublish`) and republishing the platform packages.
      - name: Publish root loader package
        if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Attach native binaries to GitHub Release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: bindings/aitp-node/artifacts/*.node
          fail_on_unmatched_files: true

  # After a real npm publish, tell each consumer of the release:
  #   aitp-control-plane, aitp-ui-console: their bump-aitp.yml calls
  #     aitp-ci/bump-consume, which waits for the npm CDN to serve the
  #     version, re-locks, and opens a PR (auto-merging on a patch).
  #     Dependabot / a weekly schedule are the backstop.
  # The verifiers (aitp-verifier-ts, aitp-verifier-go) are told by
  # notify-verifiers.yml on the `aitp-v*` tag instead: they build the Rust
  # conformance runner and need no npm package.
  # Auth: the aitp-deps-bot App (short-lived installation token, scoped to
  # the one target repo) — no PAT.
  dispatch:
    name: notify ${{ matrix.repo }} (npm)
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        repo: [aitp-control-plane, aitp-ui-console]
    steps:
      - name: Resolve version from tag
        id: ver
        working-directory: ${{ github.workspace }}
        run: echo "version=${GITHUB_REF_NAME#aitp-node-v}" >> "$GITHUB_OUTPUT"
      - name: Mint GitHub App token (scoped to ${{ matrix.repo }})
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AITP_BOT_CLIENT_ID }}
          private-key: ${{ secrets.AITP_BOT_PRIVATE_KEY }}
          owner: agentidentitytrustprotocol
          repositories: ${{ matrix.repo }}
      - name: Dispatch aitp-released (npm)
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          repository: agentidentitytrustprotocol/${{ matrix.repo }}
          event-type: aitp-released
          client-payload: '{"version": "${{ steps.ver.outputs.version }}", "ecosystem": "npm"}'
