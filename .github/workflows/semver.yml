name: semver

# `aitp` follows semver (STABILITY.md); `aitp-experimental` carries no
# promise. This workflow is separate from ci.yml so that adding
# or removing the `semver-break-approved` label re-runs only this job.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: semver-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Workspace crates that aren't published, plus `aitp-cli`, which is
  # binary-only and has no library API to compare.
  UNCHECKED_CRATES: "aitp-conformance,aitp-example-two-agents,mint-signed-examples,mint-conformance-fixtures,aitp-cli"

jobs:
  semver:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    env:
      BREAK_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'semver-break-approved') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (stable)
        with:
          toolchain: stable
      - name: An approved break needs a CHANGELOG BREAKING entry
        if: env.BREAK_APPROVED == 'true'
        run: scripts/check-breaking-entry.sh crates/aitp/CHANGELOG.md
      # Blocking. The baseline is the PR base commit SHA, not the ref
      # name: with only the PR head checked out, `main` doesn't exist as
      # a local ref, and the SHA is present after `fetch-depth: 0`.
      - name: aitp (blocking)
        if: env.BREAK_APPROVED != 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: aitp
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          # The stable features only (STABILITY.md).
          feature-group: only-explicit-features
          features: http-client,http-server,pinned-admission,metrics
      # Advisory: a break in aitp-experimental is reported, never blocks.
      - name: aitp-experimental (advisory)
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          exclude: ${{ env.UNCHECKED_CRATES }},aitp
      # Blocking. cargo-semver-checks misses some breaks (RS-RC1 found a
      # changed field type and an added variant it let through), so the
      # stable signature snapshot (scripts/public-api.py) is generated
      # for the PR head and compared with the one committed at the base.
      # The head is generated here, not read from the PR, so a PR that
      # skips `make public-api` is still checked.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (nightly)
        if: env.BREAK_APPROVED != 'true'
        with:
          toolchain: nightly-2026-05-05
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        if: env.BREAK_APPROVED != 'true'
      - name: Install cargo-public-api
        if: env.BREAK_APPROVED != 'true'
        run: cargo +nightly-2026-05-05 install --locked cargo-public-api@0.52.0
      - name: aitp stable signature snapshot (blocking)
        if: env.BREAK_APPROVED != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git show "$BASE:crates/aitp/public-api.stable.txt" > "$RUNNER_TEMP/base.txt" 2>/dev/null; then
            echo "::notice::the base commit has no stable snapshot yet; nothing to compare"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/head"
          python3 scripts/public-api.py generate --out-dir "$RUNNER_TEMP/head"
          python3 scripts/public-api.py breaks "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head/public-api.stable.txt"
