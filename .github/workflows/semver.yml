name: semver

# The `aitp` facade follows semver (STABILITY.md); the internal crates
# carry no promise. This workflow is separate from ci.yml so that adding
# or removing the `semver-break-approved` label re-runs only this job.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: semver-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Workspace crates that aren't published, plus `aitp-cli`, which is
  # binary-only and has no library API to compare.
  UNCHECKED_CRATES: "aitp-conformance,aitp-rs-adapter,aitp-example-two-agents,mint-signed-examples,mint-conformance-fixtures,aitp-cli"

jobs:
  semver:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    env:
      BREAK_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'semver-break-approved') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (stable)
        with:
          toolchain: stable
      - name: An approved break needs a CHANGELOG BREAKING entry
        if: env.BREAK_APPROVED == 'true'
        run: scripts/check-breaking-entry.sh CHANGELOG.md
      # Blocking. The baseline is the PR base commit SHA, not the ref
      # name: with only the PR head checked out, `main` doesn't exist as
      # a local ref, and the SHA is present after `fetch-depth: 0`.
      - name: aitp facade (blocking)
        if: env.BREAK_APPROVED != 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: aitp
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          # The stable features only: `experimental-*` and
          # `pinned-admission` carry no promise (STABILITY.md).
          feature-group: only-explicit-features
          features: http-client,http-server
      # Advisory: a break in an internal crate is reported, never blocks.
      - name: Internal crates (advisory)
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          exclude: ${{ env.UNCHECKED_CRATES }},aitp
      # Blocking. cargo-semver-checks can't see inside a type the facade
      # re-exports from an internal crate, so the stable signature
      # snapshot (scripts/public-api.py) is generated for the PR head and
      # compared with the one committed at the base. The head is generated
      # here, not read from the PR, so a PR that skips `make public-api`
      # is still checked.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (nightly)
        if: env.BREAK_APPROVED != 'true'
        with:
          toolchain: nightly-2026-05-05
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: env.BREAK_APPROVED != 'true'
      - name: Install cargo-public-api
        if: env.BREAK_APPROVED != 'true'
        run: cargo +nightly-2026-05-05 install --locked cargo-public-api@0.52.0
      - name: aitp stable signature snapshot (blocking)
        if: env.BREAK_APPROVED != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git show "$BASE:crates/aitp/public-api.stable.txt" > "$RUNNER_TEMP/base.txt" 2>/dev/null; then
            echo "::notice::the base commit has no stable snapshot yet; nothing to compare"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/head"
          python3 scripts/public-api.py generate --out-dir "$RUNNER_TEMP/head"
          python3 scripts/public-api.py breaks "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head/public-api.stable.txt"
