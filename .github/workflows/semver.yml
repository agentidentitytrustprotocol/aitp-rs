name: semver

# `aitp` follows semver (STABILITY.md); `aitp-experimental` carries no
# promise. This workflow is separate from ci.yml so that adding
# or removing the `semver-break-approved` label re-runs only this job.
#
# In the merge queue (merge_group) the baseline is the queue's base commit
# (main), so the check covers every PR in the group, and the approval label
# is read from the PR the group is named after (its head_ref, pr-<N>-<sha>).
# A failed label lookup counts as "not approved" (the blocking checks run).
# Accepted limit: if an EARLIER PR in the same group carries an approved
# break, a later group fails too; re-queue it once the earlier PR has landed.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # cargo-semver-checks is a required check, so it must report in the queue.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: semver-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Workspace crates that aren't published, plus `aitp-cli`, which is
  # binary-only and has no library API to compare.
  UNCHECKED_CRATES: "aitp-conformance,aitp-example-two-agents,mint-signed-examples,mint-conformance-fixtures,aitp-cli"

jobs:
  semver:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      # Sets BASELINE (the commit to compare against) and BREAK_APPROVED
      # for the steps below.
      - name: Resolve the baseline and the break approval
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'semver-break-approved') }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = merge_group ]; then
            base="$MG_BASE"
            approved=false
            pr="$(sed -nE 's#^refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<<"$MG_HEAD_REF")"
            if [ -z "$pr" ]; then
              echo "::warning::no PR number in '$MG_HEAD_REF'; treating the break as NOT approved"
            elif labels="$(gh api "repos/$REPO/pulls/$pr" --jq '.labels[].name')"; then
              if grep -qx 'semver-break-approved' <<<"$labels"; then approved=true; fi
            else
              echo "::warning::could not read PR #$pr's labels; treating the break as NOT approved"
            fi
          else
            base="$PR_BASE"
            approved="$PR_APPROVED"
          fi
          [ -n "$base" ] || { echo "::error::no baseline commit for event '$EVENT_NAME'"; exit 1; }
          echo "baseline=$base break-approved=$approved"
          { echo "BASELINE=$base"; echo "BREAK_APPROVED=$approved"; } >>"$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (stable)
        with:
          toolchain: stable
      - name: An approved break needs a CHANGELOG BREAKING entry
        if: env.BREAK_APPROVED == 'true'
        run: scripts/check-breaking-entry.sh crates/aitp/CHANGELOG.md
      # Blocking. The baseline is a commit SHA (the PR's or the queue's
      # base), not the ref name: with only the head checked out, `main`
      # doesn't exist as a local ref, and the SHA is present after
      # `fetch-depth: 0`.
      - name: aitp (blocking)
        if: env.BREAK_APPROVED != 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: aitp
          baseline-rev: ${{ env.BASELINE }}
          # The stable features only (STABILITY.md).
          feature-group: only-explicit-features
          features: http-client,http-server,pinned-admission,metrics
      # Advisory: a break in aitp-experimental is reported, never blocks.
      - name: aitp-experimental (advisory)
        continue-on-error: true
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: ${{ env.BASELINE }}
          exclude: ${{ env.UNCHECKED_CRATES }},aitp
      # Blocking. cargo-semver-checks misses some breaks (RS-RC1 found a
      # changed field type and an added variant it let through), so the
      # stable signature snapshot (scripts/public-api.py) is generated
      # for the PR head and compared with the one committed at the base.
      # The head is generated here, not read from the PR, so a PR that
      # skips `make public-api` is still checked.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (nightly)
        if: env.BREAK_APPROVED != 'true'
        with:
          toolchain: nightly-2026-05-05
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        if: env.BREAK_APPROVED != 'true'
      - name: Install cargo-public-api
        if: env.BREAK_APPROVED != 'true'
        run: cargo +nightly-2026-05-05 install --locked cargo-public-api@0.52.0
      - name: aitp stable signature snapshot (blocking)
        if: env.BREAK_APPROVED != 'true'
        env:
          BASE: ${{ env.BASELINE }}
        run: |
          if ! git show "$BASE:crates/aitp/public-api.stable.txt" > "$RUNNER_TEMP/base.txt" 2>/dev/null; then
            echo "::notice::the base commit has no stable snapshot yet; nothing to compare"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/head"
          python3 scripts/public-api.py generate --out-dir "$RUNNER_TEMP/head"
          python3 scripts/public-api.py breaks "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head/public-api.stable.txt"
