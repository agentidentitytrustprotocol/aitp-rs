[package]
name = "aitp-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Outside the main workspace — cargo-fuzz uses a custom profile and
# nightly-only features. The main workspace explicitly excludes this
# directory.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
aitp = { path = "../crates/aitp", default-features = false, features = ["pinned-admission"] }
aitp-experimental = { path = "../crates/aitp-experimental", features = ["spiffe-identity"] }
base64 = "0.22"
uuid = "1"
serde = { version = "1.0", features = ["derive"] }
url = "2"

[[bin]]
name = "envelope_parse"
path = "fuzz_targets/envelope_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_parse"
path = "fuzz_targets/manifest_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "delegation_parse"
path = "fuzz_targets/delegation_parse.rs"
test = false
doc = false
bench = false

# --- verify-path targets (R4): trust decisions live in verify, not parse ---

[[bin]]
name = "jws_verify"
path = "fuzz_targets/jws_verify.rs"
test = false
doc = false
bench = false

